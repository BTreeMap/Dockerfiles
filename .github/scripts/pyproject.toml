[project]
name = "dockerfiles-ci"
version = "0.1.0"
description = "Build orchestration for the Dockerfiles image matrix: task discovery, an ad-hoc peer-to-peer build mesh, and post-build reconciliation."
requires-python = ">=3.12"
dependencies = [
    # The http2 extra is not decoration: Cloudflare's registration API is
    # reached over HTTP/2, which httpx only speaks when `h2` is installed.
    "httpx[http2]>=0.28.1",
    # P-256 keys for MASQUE enrolment. The floor is 50.0.0 rather than the 44.0.0
    # those keys actually need: every release in [44.0.0, 50.0.0) distinguishes
    # PKCS#7 EnvelopedData decryption failures by error text and by timing, which
    # is a Bleichenbacher oracle. Nothing here decrypts EnvelopedData, so the
    # floor exists to stop a resolver from selecting a vulnerable build, not to
    # patch a call we make.
    "cryptography>=50.0.0",
    # The parse boundary. Every untrusted value in this project -- environment
    # JSON, a peer's stolen-task payload, a hostname read back from a mutable
    # git ref -- crosses into the domain through a pydantic decoder, so the
    # schema is declared once and enforced identically on both the encoding and
    # decoding side. Types the code constructs itself stay stdlib dataclasses:
    # validating a value we just built is ceremony, not safety.
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.9.4",
    # The domain model is built out of closed sums eliminated with
    # `assert_never`. That construction only means anything if something
    # actually checks exhaustiveness -- without a type checker, `assert_never`
    # is a comment that costs a function call. It is a dev dependency because
    # it gates merges, not builds.
    "mypy>=1.14",
]

[tool.uv]
# These are entry-point scripts run in place, not a distributable library, so
# there is nothing to build: `uv sync` resolves dependencies only, and `ci` is
# imported from the scripts directory on sys.path. Skipping the build backend
# keeps CI setup to a dependency install.
package = false
# h2 is reached only through httpx's http2 extra, so there is no direct
# requirement to raise. A constraint puts a floor under a transitive package
# without fabricating a dependency the code does not import: h2 <=4.4.0 accepts
# and forwards duplicate Host headers, which becomes a request-smuggling
# primitive wherever HTTP/2 is downgraded to HTTP/1.1.
constraint-dependencies = ["h2>=4.4.1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
files = ["ci", "tests", "build_docker_images.py", "create_docker_manifests.py",
         "discover_tasks.py", "reconcile_builds.py", "setup_egress.py"]
strict = true
# The point of the strict setting above is exhaustiveness. These two make a
# forgotten variant an error rather than a shrug: without them a non-exhaustive
# `match` over a union silently infers `None` and `assert_never` never fires.
warn_unreachable = true
disallow_any_explicit = false

