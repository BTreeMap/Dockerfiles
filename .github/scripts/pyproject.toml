[project]
name = "dockerfiles-ci"
version = "0.1.0"
description = "Build orchestration for the Dockerfiles image matrix: task discovery, an ad-hoc peer-to-peer build mesh, and post-build reconciliation."
requires-python = ">=3.12"
dependencies = [
    # The http2 extra is not decoration: Cloudflare's registration API is
    # reached over HTTP/2, which httpx only speaks when `h2` is installed.
    "httpx[http2]>=0.28.1",
    # P-256 keys for MASQUE enrolment need only 44.0.0, but the floor is
    # 50.0.0: releases in [44.0.0, 50.0.0) leak PKCS#7 EnvelopedData
    # decryption failures by error text and timing, a Bleichenbacher oracle.
    "cryptography>=50.0.0",
    # Every untrusted value in this project crosses the parse boundary
    # through a pydantic decoder.
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.9.4",
    # mypy gates merges by checking exhaustiveness of assert_never over the
    # closed sums.
    "mypy>=1.14",
]

[tool.uv]
# Entry-point scripts run in place, not a distributable library, so there is
# nothing to build.
package = false
# GHSA-6q48-6c7w-9gw2
# GHSA-6hr6-w5qg-qmwg
constraint-dependencies = ["certifi>=2026.10.19", "h2>=4.4.1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
files = ["ci", "tests", "build_docker_images.py", "create_docker_manifests.py",
         "discover_tasks.py", "reconcile_builds.py", "setup_egress.py"]
strict = true
# These two flags make a forgotten variant an error instead of silently
# inferring None, so assert_never fires.
warn_unreachable = true
disallow_any_explicit = false

